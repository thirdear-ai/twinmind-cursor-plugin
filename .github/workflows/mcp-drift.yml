name: MCP drift

# Daily check that the live TwinMind MCP server still matches what this plugin
# documents. On a difference it pushes the new snapshot to the mcp-drift branch
# and opens (or comments on) a single issue with a link to open the PR. The org
# does not let Actions create PRs, so a person opens it. A failed fetch fails
# the run, which GitHub emails about for scheduled workflows.

on:
  schedule:
    - cron: "17 15 * * *" # daily, 08:17 PT
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mcp-drift
  cancel-in-progress: false

env:
  DRIFT_BRANCH: mcp-drift
  DRIFT_ASSIGNEES: sunny3e
  DRIFT_LABEL: mcp-drift

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Snapshot live MCP server
        run: node scripts/snapshot-mcp.mjs

      - name: Push snapshot and open or update drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- mcp-snapshot.json; then
            echo "No drift."
            exit 0
          fi
          git diff -- mcp-snapshot.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$DRIFT_BRANCH"
          git commit -m "Update MCP snapshot from live server" -- mcp-snapshot.json
          git push --force origin "$DRIFT_BRANCH"

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${DRIFT_BRANCH}?expand=1"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create "$DRIFT_LABEL" --color D93F0B --description "Live MCP server changed" 2>/dev/null || true

          open_issue=$(gh issue list --label "$DRIFT_LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "The live MCP server changed again. The \`$DRIFT_BRANCH\` branch has the latest snapshot. Diff: $run_url"
          else
            {
              echo "**[Open the PR]($compare_url)** from the \`$DRIFT_BRANCH\` branch, which has the updated snapshot. Diff: $run_url"
              echo
              cat .github/mcp-drift-pr.md
            } > "$RUNNER_TEMP/issue.md"
            gh issue create \
              --title "MCP server changed: update plugin docs" \
              --label "$DRIFT_LABEL" \
              --assignee "$DRIFT_ASSIGNEES" \
              --body-file "$RUNNER_TEMP/issue.md"
          fi
